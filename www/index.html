<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>JARVIS OS</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0A0A0F; color: #E7ECF3;
        font-family: system-ui, -apple-system, sans-serif; }
      .wrap { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; }
      .ring { width: 46px; height: 46px; border: 3px solid rgba(79,195,247,.25); border-top-color: #4FC3F7;
        border-radius: 50%; animation: spin 0.9s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .name { font-weight: 700; letter-spacing: .18em; font-size: 14px; color: #4FC3F7; }
      .err { display: none; color: #EF4444; font-size: 13px; margin-top: 12px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="ring"></div>
      <div class="name">J.A.R.V.I.S.</div>
      <div class="err" id="err">
        Unable to connect. Check your internet and try again.
        <br><a href="javascript:location.reload()" style="color:#4FC3F7">Retry</a>
      </div>
    </div>
    <script>
      // Show error after 8s if still on splash (app hasn't loaded)
      setTimeout(function() {
        document.getElementById('err').style.display = 'block';
      }, 8000);
    </script>
  </body>
</html>
