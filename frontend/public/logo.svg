<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="38%" cy="34%" r="75%">
      <stop offset="0%" stop-color="#0D1B30"/>
      <stop offset="55%" stop-color="#07111F"/>
      <stop offset="100%" stop-color="#050505"/>
    </radialGradient>
    <radialGradient id="pupilGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4FC3F7" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#4FC3F7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="violetArc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7B5CF0"/>
      <stop offset="100%" stop-color="#4FC3F7"/>
    </linearGradient>
  </defs>

  <!-- ground -->
  <rect x="0" y="0" width="512" height="512" fill="url(#bg)"/>

  <!-- arc-reactor rings, centered instrument-panel geometry -->
  <circle cx="256" cy="256" r="192" fill="none" stroke="#4FC3F7" stroke-opacity="0.14" stroke-width="1.5"/>
  <circle cx="256" cy="256" r="164" fill="none" stroke="#4FC3F7" stroke-opacity="0.28" stroke-width="1.5"/>

  <!-- secondary violet accent arc — flourish only, never the primary signal -->
  <path d="M 256 92 A 164 164 0 0 1 366 138" fill="none" stroke="url(#violetArc)" stroke-width="3" stroke-linecap="round"/>

  <!-- pupil glow -->
  <circle cx="256" cy="256" r="96" fill="url(#pupilGlow)"/>

  <!-- the eye: a precise lens, not a soft blob -->
  <path d="M 118 256 Q 256 168 394 256 Q 256 344 118 256 Z"
        fill="#07111F" stroke="#4FC3F7" stroke-width="11" stroke-linejoin="round"/>

  <!-- iris -->
  <circle cx="256" cy="256" r="46" fill="none" stroke="#4FC3F7" stroke-width="7" stroke-opacity="0.55"/>

  <!-- pupil -->
  <circle cx="256" cy="256" r="30" fill="#4FC3F7"/>
</svg>
