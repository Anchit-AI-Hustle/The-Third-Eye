name: TheThirdEye
options:
  deploymentTarget:
    iOS: "17.0"
targets:
  TheThirdEye:
    type: application
    platform: iOS
    sources: [Sources, Resources]
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: The Third Eye
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
          UIImageRespectsSafeAreaInsets: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIUserInterfaceStyle: Dark
        NSMicrophoneUsageDescription: The Third Eye listens when you tap the mic or start a call, so you can talk to your assistant.
        NSSpeechRecognitionUsageDescription: Apple speech recognition turns what you say into text so the assistant can act on it.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.thethirdeye.app
        MARKETING_VERSION: "2.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
