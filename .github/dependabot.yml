version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule: { interval: "weekly" }
    open-pull-requests-limit: 5
    groups:
      # React refuses to run when react and react-dom differ by even a patch
      # (#478 bumped react alone and failed 40 test files on main).
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
    ignore:
      # These majors broke main when they merged unattended:
      #   typescript 7: Next resolves typescript/lib/typescript.js, which the
      #                 native rewrite does not ship, so lint reports it as
      #                 uninstalled.
      #   vitest 4:     two .tsx files stopped parsing, so ten tests quietly
      #                 stopped being collected rather than failing.
      #   tailwindcss 4: a config and CSS migration, not a version bump.
      # Each is a planned migration on its own branch. Every other package gets
      # major-version PRs again (the blanket "*" ignore hid the Next.js CVE fix,
      # AUDIT F-10), and .github/workflows/npm-audit.yml fails on new
      # high/critical advisories either way.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "pip"
    directory: "/backend"
    schedule: { interval: "weekly" }
    open-pull-requests-limit: 5
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: { interval: "monthly" }
