version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule: { interval: "weekly" }
    open-pull-requests-limit: 5
    ignore:
      # TypeScript 7 is the native rewrite: no `main`, and an exports map of
      # "." → lib/version.cjs. Next 14 detects TypeScript by resolving the file
      # typescript/lib/typescript.js, which that package does not contain, so
      # `next lint` fails with "TypeScript ... not installed" even though the
      # install succeeded. Bumping to it broke main. Lift this once Next
      # supports TS 7 — minor and patch updates within 5.x still come through.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # Vitest 4 was proposed as a single jump from 2.x. It fails to parse the
      # two .tsx test files (so their tests silently stop being collected) and
      # drops cancelAnimationFrame from the environment, breaking the wake-word
      # suite. Migrating is real work — updating the react plugin and reworking
      # the rAF stubs — and worth doing deliberately rather than arriving as an
      # automated bump. Minor and patch updates within 2.x still come through.
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule: { interval: "weekly" }
    open-pull-requests-limit: 5
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: { interval: "monthly" }
