name: Backend nightly memory consolidation

# Free replacement for backend/'s in-process APScheduler job. On a
# scale-to-zero host (Cloud Run without a minimum instance count — the free
# option, see PROJECT_STATUS.md), the process usually isn't running at the
# scheduled hour, so an in-process scheduler can't be relied on to fire.
# GitHub Actions' own cron is free and always running, so it wakes the
# service instead.
#
# No-ops safely until BACKEND_URL and BACKEND_CRON_SECRET repo secrets are
# set (backend not deployed yet, or deployed without INTERNAL_CRON_SECRET
# configured) — the curl fails with an explanatory log line instead of the
# workflow appearing to hang or silently doing nothing.

on:
  schedule:
    - cron: "17 2 * * *" # 02:17 UTC daily — off the hour, avoids the top-of-hour crowd
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call the backend's consolidation endpoint
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          BACKEND_CRON_SECRET: ${{ secrets.BACKEND_CRON_SECRET }}
        run: |
          if [ -z "$BACKEND_URL" ] || [ -z "$BACKEND_CRON_SECRET" ]; then
            echo "BACKEND_URL and/or BACKEND_CRON_SECRET repo secrets are not set — skipping. Set both once the backend is deployed with INTERNAL_CRON_SECRET configured."
            exit 0
          fi
          status=$(curl -s -o /tmp/resp.json -w "%{http_code}" -X POST \
            -H "X-Cron-Secret: $BACKEND_CRON_SECRET" \
            "$BACKEND_URL/internal/run-consolidation")
          echo "HTTP $status"
          cat /tmp/resp.json
          if [ "$status" != "200" ]; then
            echo "Consolidation trigger failed"
            exit 1
          fi
