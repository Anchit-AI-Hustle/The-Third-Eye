name: CodeQL

# Static application security testing. Runs on every push/PR to main and on a
# weekly schedule so newly-disclosed query packs catch old code too. Results
# land in the repo's Security → Code scanning tab.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "27 3 * * 1" # Mondays 03:27 UTC

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    steps:
      - uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          language: ${{ matrix.language }}
          # security-extended adds the higher-signal security queries on top of
          # the default set (injection, SSRF, auth, sensitive-data-flow).
          queries: security-extended
      - name: Setup Node
        if: matrix.language == 'javascript-typescript'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python
        if: matrix.language == 'python'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build frontend (JS/TS only)
        if: matrix.language == 'javascript-typescript'
        working-directory: frontend
        run: |
          npm ci
          npx next build
        env:
          GEMINI_API_KEY: ci-placeholder
          NEXTAUTH_SECRET: ci-placeholder

      - name: Build backend (Python only)
        if: matrix.language == 'python'
        working-directory: backend
        run: pip install -e .
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
