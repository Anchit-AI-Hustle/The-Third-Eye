name: Android APK
# A debug APK of the Capacitor shell, built on GitHub's runner (free on a
# public repo, and its image already carries the Android SDK and JDK 21).
# Install it by downloading the artifact on the phone and allowing installs
# from that source. Store releases still need a signed bundle (NATIVE_BUILD.md).
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["android/**", "capacitor.config.ts", "package.json", "package-lock.json"]
  pull_request:
    paths: ["android/**", "capacitor.config.ts", "package.json", "package-lock.json", ".github/workflows/android-apk.yml"]
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npx cap sync android
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: android
      - uses: actions/upload-artifact@v7
        with:
          name: jarvis-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
