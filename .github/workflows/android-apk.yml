name: Android APK
# A debug APK of the Capacitor shell, built on GitHub's runner (free on a
# public repo, and its image already carries the Android SDK and JDK 21).
# Builds from main also replace the asset on the public "android-latest"
# release, which the site's /install page links for a one-tap download.
# Store releases still need a signed bundle (NATIVE_BUILD.md).
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["android/**", "capacitor.config.ts", "package.json", "package-lock.json"]
  pull_request:
    paths: ["android/**", "capacitor.config.ts", "package.json", "package-lock.json", ".github/workflows/android-apk.yml"]
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npx cap sync android
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: android
      - uses: actions/upload-artifact@v7
        with:
          name: jarvis-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish to the android-latest release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk the-third-eye.apk
          gh release view android-latest >/dev/null 2>&1 || gh release create android-latest --title "Android app" --notes "Install: open the-third-eye.apk on your phone and allow installs from your browser. The app loads the live site, so it stays current."
          gh release upload android-latest the-third-eye.apk --clobber
