name: npm audit
on:
  schedule: [{ cron: "17 6 * * 1" }]
  pull_request: { paths: ["frontend/package.json", "frontend/package-lock.json", "frontend/audit-baseline.json"] }
  workflow_dispatch: {}
jobs:
  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      # Fails on any high/critical advisory in production dependencies, and on
      # any new one in dev dependencies (known ones are in audit-baseline.json).
      - run: node scripts/auditGate.mjs
