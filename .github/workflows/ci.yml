name: CI
on:
  push: { branches: [main] }
  pull_request: {}
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        # jsdom 30 (via vitest) requires node ^22.22.2 || ^24.15.0 || >=26 —
        # on node 20 its bundled undici calls webidl.util.markAsUncloneable,
        # which does not exist, and every test file fails to collect.
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run type-check
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          GEMINI_API_KEY: ci-placeholder
          NEXTAUTH_SECRET: ci-placeholder
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - run: ruff check app
      - run: pytest --cov=app -q --maxfail=1
        env:
          ENVIRONMENT: test
          SECRET_KEY: test-secret-key-with-at-least-32-chars
          # Must be a real Fernet key or app.finance.encryption raises on use.
          FINANCIAL_ENCRYPTION_KEY: "MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA="
          # Quoted: the trailing colon makes this a mapping key to the YAML
          # parser otherwise, which fails the whole workflow before any job runs.
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          REDIS_URL: "redis://localhost:6379/0"
          NEXTAUTH_SECRET: test-nextauth-secret-with-32-chars
          GOOGLE_AI_API_KEY: test-google-ai-key
