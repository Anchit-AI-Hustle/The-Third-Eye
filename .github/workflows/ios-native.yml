name: iOS native app
# Builds the SwiftUI app in ios-native/ (project generated by XcodeGen) for the
# iOS Simulator, launches it on a small and a large iPhone, and saves what it
# shows so a cut-off layout is caught before anyone installs it. The tab shots
# have no account; the More screens (-preview-screen) answer from fixtures in
# Sources/PreviewMode.swift. Builds from main also publish an unsigned device
# .ipa to the "ios-native-latest" release that /get links, for installing with
# a sideloader and the user's own Apple ID.
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["ios-native/**", ".github/workflows/ios-native.yml"]
  pull_request:
    paths: ["ios-native/**", ".github/workflows/ios-native.yml"]
permissions:
  contents: read
# Two pushes to main must not race on the release upload.
concurrency:
  group: ios-native-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - run: brew install xcodegen
      - run: xcodegen generate
        working-directory: ios-native
      - name: Build for the simulator
        working-directory: ios-native
        run: |
          set -o pipefail
          xcodebuild -project TheThirdEye.xcodeproj -scheme TheThirdEye -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build.log | grep -E "error:|warning: .*(deprecated|unused)|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log
      - name: Launch on a small and a large iPhone
        working-directory: ios-native
        run: |
          mkdir -p preview
          APP=build/Build/Products/Debug-iphonesimulator/TheThirdEye.app
          python3 - > devices.txt <<'PYEOF'
          import json, subprocess
          d = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"]))["devices"]
          phones = [x for k in sorted(d, reverse=True) if "iOS" in k for x in d[k] if x["name"].startswith("iPhone")]
          pick = {}
          for p in phones:
              if "SE" in p["name"] or "mini" in p["name"] or p["name"].endswith(" e") or p["name"].endswith("16e"):
                  pick.setdefault("small", p)
              if "Pro Max" in p["name"] or "Plus" in p["name"]:
                  pick.setdefault("large", p)
          pick.setdefault("small", phones[-1]); pick.setdefault("large", phones[0])
          for k, p in pick.items(): print(k, p["udid"], p["name"].replace(" ", "_"))
          PYEOF
          cat devices.txt
          while read SIZE UDID NAME; do
            xcrun simctl boot "$UDID"
            xcrun simctl bootstatus "$UDID" -b
            xcrun simctl install "$UDID" "$APP"
            xcrun simctl launch "$UDID" com.thethirdeye.app
            sleep 12
            xcrun simctl io "$UDID" screenshot "preview/$SIZE-$NAME.png"
            for TAB in today assistant tasks notes more; do
              xcrun simctl terminate "$UDID" com.thethirdeye.app || true
              xcrun simctl launch "$UDID" com.thethirdeye.app -preview-tab "$TAB"
              sleep 6
              xcrun simctl io "$UDID" screenshot "preview/$SIZE-$TAB.png"
            done
            for SCREEN in studio studio-tool generations generation skills apps plans capabilities agents audit kolab job-agent job-saved job-applications job-profile settings; do
              xcrun simctl terminate "$UDID" com.thethirdeye.app || true
              xcrun simctl launch "$UDID" com.thethirdeye.app -preview-tab more -preview-screen "$SCREEN"
              sleep 6
              xcrun simctl io "$UDID" screenshot "preview/$SIZE-$SCREEN.png"
            done
            xcrun simctl shutdown "$UDID"
          done < devices.txt
      - name: Push screenshots to the app-previews branch
        if: always()
        run: |
          git fetch origin app-previews || true
          git worktree add -B app-previews ../shots origin/app-previews 2>/dev/null || { git worktree add --detach ../shots && git -C ../shots checkout --orphan app-previews && git -C ../shots rm -rfq . ; }
          mkdir -p ../shots/ios-native && rm -f ../shots/ios-native/* && cp ios-native/preview/*.png ../shots/ios-native/ 2>/dev/null || true
          tail -50 ios-native/build.log > ../shots/ios-native/build-tail.txt 2>/dev/null || true
          grep -E "error:" ios-native/build.log > ../shots/ios-native/build-errors.txt 2>/dev/null || true
          cd ../shots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ios-native && git commit -qm "ios-native preview from ${{ github.sha }}" && git push origin app-previews || true
      - uses: actions/upload-artifact@v7
        with:
          name: ios-native-preview
          path: |
            ios-native/preview/
            ios-native/build.log
          if-no-files-found: error
      - name: Build the unsigned device .ipa
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        working-directory: ios-native
        run: |
          xcodebuild -project TheThirdEye.xcodeproj -scheme TheThirdEye -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build-device \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir Payload
          cp -R build-device/Build/Products/Release-iphoneos/TheThirdEye.app Payload/
          zip -qry ../the-third-eye-native.ipa Payload
      - name: Publish to the ios-native-latest release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view ios-native-latest >/dev/null 2>&1 || gh release create ios-native-latest --title "iOS native app" --notes "Unsigned .ipa of the native SwiftUI app. Install with Sideloadly or AltStore using your Apple ID; a free Apple ID's signature lasts 7 days."
          gh release upload ios-native-latest the-third-eye-native.ipa --clobber
