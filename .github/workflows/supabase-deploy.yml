name: Deploy migration pushes

# Migrations are no longer pushed from CI.
#
# The database moved from Supabase to Neon, and the schema is now applied by
# `node scripts/migrate.mjs`, which runs as the first half of the Vercel build
# (frontend/package.json -> "build"). That is the only moment when the
# connection string and the SQL files are in the same place, and it makes the
# schema and the code that reads it land together or not at all.
#
# This workflow is kept because vercel-deploy.yml defers migration pushes to it
# BY NAME: a push touching supabase/migrations/** is handed here so the schema
# is applied before the app is promoted. That ordering is now intrinsic to the
# build, so all this has left to do is hand the push straight back with the
# defer suppressed. Deleting this file without also removing that guard would
# leave migration pushes deferred to a workflow that does not exist, and they
# would never deploy at all.
#
# SUPABASE_ACCESS_TOKEN and SUPABASE_DB_PASSWORD are no longer read by anything
# in this repository and can be removed from the repo's Actions secrets.

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
  workflow_dispatch: {}

# Least privilege: this workflow only hands off to another workflow.
permissions:
  contents: read

jobs:
  deploy:
    uses: ./.github/workflows/vercel-deploy.yml
    with:
      migration_gated: true
    secrets: inherit
